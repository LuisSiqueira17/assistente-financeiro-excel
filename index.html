
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistente Financeiro</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:20px;color:#20312a;background:#f7faf8}
h2{color:#176b45;margin-top:0}
button{background:#176b45;color:white;border:0;border-radius:6px;padding:10px 14px;cursor:pointer;margin:5px 0}
#status{margin-top:14px;padding:10px;background:#e8f3ed;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
small{color:#52635a}
</style>
</head>
<body>
<h2>Assistente Financeiro</h2>
<p>Vamos testar a leitura dos dados do Excel.</p>

<button id="check">Verificar conexão com o Excel</button>
<button id="read">Ler amostra das tabelas</button>
<button id="readFull">Ler tabelas completas</button>
<button id="catalog">Catalogar todas as tabelas</button>

<div id="status">Aguardando verificação.</div>

<p><small>
A leitura é feita localmente no Excel. Nenhum dado financeiro é enviado para fora do arquivo.
</small></p>

<script>
Office.onReady(function(info){
  document.getElementById("status").textContent =
    info.host === Office.HostType.Excel
    ? "Excel conectado. Você pode testar a leitura."
    : "Abra este suplemento no Excel.";
});

document.getElementById("check").addEventListener("click", async function(){
  const status=document.getElementById("status");

  try{
    await Excel.run(async function(context){
      const tables=context.workbook.tables;
      tables.load("items/name");
      await context.sync();

      const details=[];

      for(const table of tables.items){
        table.columns.load("items/name");
      }

      await context.sync();

      for(const table of tables.items){
        details.push(
          table.name+": "+
          table.columns.items.map(c=>c.name).join(", ")
        );
      }

      status.textContent="Conexão confirmada.\n\n"+details.join("\n");
    });
  }catch(e){
    status.textContent="Erro: "+e.message;
  }
});

document.getElementById("read").addEventListener("click", async function(){
  const status=document.getElementById("status");
  status.textContent="Lendo amostra localmente...";

  try{
    await Excel.run(async function(context){
      const names=["tbLancamentos","tabela_contas"];
      const results=[];

      for(const name of names){
        const table=context.workbook.tables.getItem(name);
        table.columns.load("items/name");
        table.rows.load("count");
        await context.sync();

        const headers=table.columns.items.map(c=>c.name);
        const totalRows=table.rows.count;

        results.push("\n=== "+name+" ===");
        results.push("Total de linhas: "+totalRows);

        if(totalRows===0){
          results.push("Tabela sem registros.");
          continue;
        }

        const body=table.getDataBodyRange();
        const sampleRows=Math.min(3,totalRows);
        const sample=body.getCell(0,0).getResizedRange(
          sampleRows-1,
          headers.length-1
        );

        sample.load("values");
        await context.sync();

        results.push("Amostra das primeiras "+sampleRows+" linhas:");
        results.push(headers.join(" | "));

        for(const row of sample.values){
          results.push(row.map(value=>
            value===null || value===undefined ? "" : String(value)
          ).join(" | "));
        }
      }

      status.textContent=results.join("\n");
    });
  }catch(e){
    status.textContent="Não foi possível ler os dados: "+e.message;
  }
});

document.getElementById("readFull").addEventListener("click", async function(){
  const status=document.getElementById("status");
  status.textContent="Lendo todas as linhas das tabelas...";

  try{
    await Excel.run(async function(context){
      const names=["tbLancamentos","tabela_contas"];
      const results=[];

      for(const name of names){
        const table=context.workbook.tables.getItem(name);

        table.columns.load("items/name");
        table.rows.load("count");
        await context.sync();

        const headers=table.columns.items.map(c=>c.name);
        const totalRows=table.rows.count;

        results.push("\n=== "+name+" ===");
        results.push("Total de linhas: "+totalRows);
        results.push(headers.join(" | "));

        if(totalRows===0){
          results.push("Tabela sem registros.");
          continue;
        }

        const body=table.getDataBodyRange();
        const fullRange=body.getCell(0,0).getResizedRange(
          totalRows-1,
          headers.length-1
        );

        fullRange.load("values");
        await context.sync();

        results.push("Registros completos:");

        for(let i=0;i<fullRange.values.length;i++){
          const row=fullRange.values[i];

          results.push(
            (i+1)+": "+
            row.map(value=>
              value===null || value===undefined ? "" : String(value)
            ).join(" | ")
          );
        }
      }

      status.textContent=results.join("\n");
    });
  }catch(e){
    status.textContent="Não foi possível ler as tabelas completas: "+e.message;
  }
});

document.getElementById("catalog").addEventListener("click", async function(){
  const status=document.getElementById("status");
  status.textContent="Catalogando todas as tabelas do arquivo...";

  try{
    await Excel.run(async function(context){
      const tables=context.workbook.tables;
      tables.load("items/name");
      await context.sync();

      for(const table of tables.items){
        table.columns.load("items/name");
        table.rows.load("count");
      }

      await context.sync();

      const results=[];
      results.push("CATÁLOGO DO ARQUIVO");
      results.push("Total de tabelas: "+tables.items.length);

      for(const table of tables.items){
        results.push("\n=== "+table.name+" ===");
        results.push("Registros: "+table.rows.count);
        results.push(
          "Colunas: "+
          table.columns.items.map(c=>c.name).join(" | ")
        );
      }

      status.textContent=results.join("\n");
    });
  }catch(e){
    status.textContent="Erro ao catalogar tabelas: "+e.message;
  }
});
</script>
</body>
</html>
